[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "torchinstruments"
version = "0.3.0"
description = "Passive, trainer-agnostic telemetry for PyTorch models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" },
]
dependencies = [
    "torch>=2.0",
]
keywords = ["pytorch", "observability", "telemetry", "training", "diagnostics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Red-Eyed/torchinstruments"
Issues = "https://github.com/Red-Eyed/torchinstruments/issues"
Repository = "https://github.com/Red-Eyed/torchinstruments"

[dependency-groups]
dev = [
    "dirty-equals>=0.11.0",
    "lightning>=2.6.5",
    "pyrefly>=0.34.0",
    "pytest>=8.3.0",
    "ruff>=0.12.0",
    "tensorboard>=2.21.0",
    "torchvision>=0.28.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["examples/**/*.py", "src/**/*.py", "tests/**/*.py"]
search-path = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
